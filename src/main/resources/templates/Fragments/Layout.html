
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
    This file contains a reusable navbar fragment.
    Other Thymeleaf pages can include this navbar
    without copying the same HTML repeatedly.
-->

<body>

    <!-- ===== NAVBAR ===== -->
 
    <header class="navbar" th:fragment="navbar">

        <nav class="container navbar-inner">

            <!-- Website Logo / Name -->
            <a href="#home"
               class="navbar-logo"
               th:text="${name}">
                Shashikala yadav
            </a>

            <!-- Mobile Menu Toggle Button -->
            <button
                type="button"
                class="navbar-toggle"
                aria-label="Open or close the menu"
                aria-expanded="false"
                aria-controls="navbar-links">
                &#9776;
            </button>

            <!-- Navigation Links -->
            <ul class="navbar-links" id="navbar-links">

                <li>
                    <a href="#about">About</a>
                </li>

                <li>
                    <a href="#skills">Skills</a>
                </li>

                <li>
                    <a href="#projects">Projects</a>
                </li>

                <li>
                    <a href="#journey">Journey</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>

            </ul>

        </nav>

    </header>

</body>
</html>
